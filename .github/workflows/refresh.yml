name: refresh
# Finds the makers' newer releases and lists the pin changes in the run's summary. Nothing is committed: run
# `node scripts/refresh.ts` and commit pins.json yourself, then publish.yml signs the registry.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/refresh.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm run build
      - run: npm run check
      - name: List the pin changes
        run: |
          set -euo pipefail
          if git diff --quiet pins.json; then echo "Every pin and source is current." >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          { echo "Pins to move. Run \`node scripts/refresh.ts\` and commit pins.json."; echo; echo '```diff'; git diff pins.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
